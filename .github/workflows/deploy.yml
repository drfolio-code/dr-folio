name: Publicar Dr.Folio

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  hosting:
    name: Web (Firebase Hosting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: drfolio-6af54

  rules:
    name: Reglas de seguridad (Firestore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Publicar firestore.rules (API de Firebase Rules)
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: drfolio-6af54
        run: |
          set -euo pipefail
          API="https://firebaserules.googleapis.com/v1/projects/$PROJECT"
          BODY=$(jq -n --rawfile c firestore.rules '{source:{files:[{name:"firestore.rules",content:$c}]}}')
          RULESET=$(curl -sSf -X POST "$API/rulesets" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$BODY" | jq -r .name)
          echo "Ruleset: $RULESET"
          REL="projects/$PROJECT/releases/cloud.firestore"
          UPD=$(jq -n --arg n "$REL" --arg r "$RULESET" '{release:{name:$n,rulesetName:$r}}')
          if ! curl -sSf -X PATCH "$API/releases/cloud.firestore" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$UPD"; then
            NEW=$(jq -n --arg n "$REL" --arg r "$RULESET" '{name:$n,rulesetName:$r}')
            curl -sSf -X POST "$API/releases" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$NEW"
          fi
          echo "Reglas publicadas"
